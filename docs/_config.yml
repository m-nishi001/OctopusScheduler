title: OctopusScheduler ドキュメント
lang: ja
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
relative_links:
  enabled: true
  collections: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
# Pages では使わないもの(GAS 用の単一 HTML とビューアのテンプレート。html/style.css は共有する)
exclude:
  - html/index.html
  - html/app.js
  - gas
  - markdown/sitemap.json
