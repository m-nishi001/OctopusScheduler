<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 530" role="img" aria-label="通信の流れ">
<defs>
<marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="ahp"/>
</marker>
</defs>
<title>通信の流れ</title>
<desc>画面からAPIクライアント、サーバー入口、各機能、infrastructures、保存先へ</desc>
<rect x="10" y="10" width="270" height="64" rx="10" class="bx app"/>
<text x="145" y="32.9" text-anchor="middle" dominant-baseline="central" class="tx b" font-size="13">画面（Vue）</text>
<text x="145" y="51.1" text-anchor="middle" dominant-baseline="central" class="tm" font-size="13">設定・実行・ポータルの各画面</text>
<text x="294" y="32" text-anchor="start" dominant-baseline="central" class="tm" font-size="12">ブラウザの中。</text>
<text x="294" y="50" text-anchor="start" dominant-baseline="central" class="tm" font-size="12">手元(IndexedDB)を先に表示</text>
<path d="M145,74 L145,98" class="ln" marker-end="url(#ah4)"/>
<rect x="10" y="98" width="270" height="64" rx="10" class="bx"/>
<text x="145" y="120.9" text-anchor="middle" dominant-baseline="central" class="tx b" font-size="13">APIクライアント</text>
<text x="145" y="139.1" text-anchor="middle" dominant-baseline="central" class="tm" font-size="13">名前つきの呼び出し口</text>
<text x="294" y="120" text-anchor="start" dominant-baseline="central" class="tm" font-size="12">例: accounts_login</text>
<text x="294" y="138" text-anchor="start" dominant-baseline="central" class="tm" font-size="12">名前は型で縛られる</text>
<path d="M145,162 L145,186" class="ln" marker-end="url(#ah4)"/>
<rect x="10" y="186" width="270" height="64" rx="10" class="bx srv"/>
<text x="145" y="199.8" text-anchor="middle" dominant-baseline="central" class="tx b" font-size="13">サーバー入口</text>
<text x="145" y="218.0" text-anchor="middle" dominant-baseline="central" class="tm" font-size="13">GAS: google.script.run</text>
<text x="145" y="236.2" text-anchor="middle" dominant-baseline="central" class="tm" font-size="13">CF: POST /rpc</text>
<text x="294" y="208" text-anchor="start" dominant-baseline="central" class="tm" font-size="12">どちらも同じ名前の</text>
<text x="294" y="226" text-anchor="start" dominant-baseline="central" class="tm" font-size="12">関数に届く</text>
<path d="M145,250 L145,274" class="ln" marker-end="url(#ah4)"/>
<rect x="10" y="274" width="270" height="64" rx="10" class="bx"/>
<text x="145" y="296.9" text-anchor="middle" dominant-baseline="central" class="tx b" font-size="13">各機能（endpoints.ts）</text>
<text x="145" y="315.1" text-anchor="middle" dominant-baseline="central" class="tm" font-size="13">secure(admin|public) で認可</text>
<text x="294" y="296" text-anchor="start" dominant-baseline="central" class="tm" font-size="12">管理者かどうかを</text>
<text x="294" y="314" text-anchor="start" dominant-baseline="central" class="tm" font-size="12">毎回ここで検査</text>
<path d="M145,338 L145,362" class="ln" marker-end="url(#ah4)"/>
<rect x="10" y="362" width="270" height="64" rx="10" class="bx"/>
<text x="145" y="384.9" text-anchor="middle" dominant-baseline="central" class="tx b" font-size="13">infrastructures</text>
<text x="145" y="403.1" text-anchor="middle" dominant-baseline="central" class="tm" font-size="13">保存・排他などの共通の窓口</text>
<text x="294" y="384" text-anchor="start" dominant-baseline="central" class="tm" font-size="12">環境差はここで吸収</text>
<text x="294" y="402" text-anchor="start" dominant-baseline="central" class="tm" font-size="12">（部品の差し替え）</text>
<path d="M145,426 L145,450" class="ln" marker-end="url(#ah4)"/>
<path d="M10,457 a135,7 0 0 1 270,0 v56 a135,7 0 0 1 -270,0 z" class="bx"/>
<path d="M10,457 a135,7 0 0 0 270,0" class="bx nf"/>
<text x="145" y="470.3" text-anchor="middle" dominant-baseline="central" class="tx b" font-size="13">保存先</text>
<text x="145" y="488.5" text-anchor="middle" dominant-baseline="central" class="tm" font-size="13">GAS: スクリプトプロパティ・Drive</text>
<text x="145" y="506.7" text-anchor="middle" dominant-baseline="central" class="tm" font-size="13">CF: R2・D1・Durable Object</text>
</svg>
