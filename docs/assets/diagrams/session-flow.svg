<text x="240" y="460.9" text-anchor="middle" dominant-baseline="central" class="tx b" font-size="13">会場ホストPC</text>
<text x="240" y="479.1" text-anchor="middle" dominant-baseline="central" class="tm" font-size="13">状態の正（権威）</text>
