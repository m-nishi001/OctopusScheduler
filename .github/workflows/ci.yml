name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR に新しいコミットが来たら、古い実行は止める(main は止めない)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# wrangler にテレメトリを送らせない(e2e はすべてローカルの wrangler dev --local。Cloudflare へのアクセスは無い)
env:
  WRANGLER_SEND_METRICS: "false"

# 各ジョブは互いに待たず並列に走る。待つのは「build → e2e / check-dist(dist が要る)」だけ。
#   lint / typecheck / unit ... build 不要(typecheck は turbo が必要な分だけ自分でビルドする)
#   build .................... dist を作って artifact にする。e2e はこれだけを待つ(typecheck / verify は待たない)
#   check-dist ............... dist の検証(verify:gas / verify:dist)。build のあと e2e と並列に走る
#   e2e ...................... worker-smoke と、画面の通し(Playwright)を Cloudflare(ui-*) と GAS シミュレーター(gas-*)で流す。
#                              シャードは spec の所要時間(e2e/shard-weights.json)で均等に分ける(scripts/e2e-shards.js)。
#                              重い jackpot-scale は専用のシャードに分ける。どれもローカルで動き、外部へのアクセスは無い
#   verify ................... 全ジョブの結果を1つにまとめる(以前の check 名 `verify` を維持する集約ジョブ)
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-lint-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-unit-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-unit-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      # 全パッケージのテストを1回だけ流す。coverage の下限(server / model / transport など。各パッケージの
      # vitest.config.ts の coverage.thresholds)もこの1回で確かめる。test:coverage は test と同じ範囲を流すスクリプトにそろえてある
      - run: npm run test:coverage
      - run: npm run test:scripts

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-typecheck-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: e2e へ渡すビルド成果物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  # dist の検証。e2e は待たない
  check-dist:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npm run verify

  # 実 workerd(wrangler dev --local)で Durable Object / WebSocket を含む通しの動作と、
  # ホスト・管理・参加者の複数端末の画面操作(Playwright)を確認する。
  e2e:
    needs: build
    runs-on: ubuntu-latest
    # GAS シミュレーターは 1 呼び出しに 200ms の遅延を足すので、Cloudflare より 1 テストが長い(分割しても 20 分前後のシャードがある)
    # シャードは 5〜7 分(setup 込み)に均してある。余裕を見て 25 分で止める
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: worker-smoke
            args: worker-smoke
          # 重い jackpot-scale は専用のシャード(Playwright の --shard はファイルの中のテストも分ける)
          - name: ui-scale-1of2
            args: ui -- e2e/ui/jackpot-scale.spec.ts --shard=1/2
          - name: ui-scale-2of2
            args: ui -- e2e/ui/jackpot-scale.spec.ts --shard=2/2
          # 残りの spec は所要時間で4束に分ける(serial の spec はファイル単位で同じ束に入る)
          - name: ui-1of4
            args: ui -- $(node scripts/e2e-shards.js ui 1/4)
          - name: ui-2of4
            args: ui -- $(node scripts/e2e-shards.js ui 2/4)
          - name: ui-3of4
            args: ui -- $(node scripts/e2e-shards.js ui 3/4)
          - name: ui-4of4
            args: ui -- $(node scripts/e2e-shards.js ui 4/4)
          # GAS 実行環境シミュレーター(dist/gas/server.js を GAS に近い条件で動かす)に対する、同じ画面の通し。
          # 1 呼び出しに 200ms の遅延を足すので Cloudflare より長く、束も多い
          - name: gas-scale-1of3
            args: --target gas ui -- e2e/ui/jackpot-scale.spec.ts --shard=1/3
          - name: gas-scale-2of3
            args: --target gas ui -- e2e/ui/jackpot-scale.spec.ts --shard=2/3
          - name: gas-scale-3of3
            args: --target gas ui -- e2e/ui/jackpot-scale.spec.ts --shard=3/3
          - name: gas-1of6
            args: --target gas ui -- $(node scripts/e2e-shards.js gas 1/6)
          - name: gas-2of6
            args: --target gas ui -- $(node scripts/e2e-shards.js gas 2/6)
          - name: gas-3of6
            args: --target gas ui -- $(node scripts/e2e-shards.js gas 3/6)
          - name: gas-4of6
            args: --target gas ui -- $(node scripts/e2e-shards.js gas 4/6)
          - name: gas-5of6
            args: --target gas ui -- $(node scripts/e2e-shards.js gas 5/6)
          - name: gas-6of6
            args: --target gas ui -- $(node scripts/e2e-shards.js gas 6/6)
    name: e2e (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # ブラウザ本体はキャッシュし、OS の依存ライブラリは毎回入れる(キャッシュできないため)
      - name: Playwright のバージョン
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        if: matrix.name != 'worker-smoke'
      - uses: actions/cache@v4
        id: playwright-cache
        if: matrix.name != 'worker-smoke'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # OS の依存ライブラリ(apt)は毎回要る。apt のミラーが詰まると 10 分近く止まることがあった(測定)ので、
      # apt 自身に短いタイムアウトと再試行を設定する(外から timeout で殺すと apt のロックが残って再試行できなくなる)。
      # それでも詰まったら 6 分でジョブを落とす(再実行で直る)
      - name: Playwright の OS 依存ライブラリ
        if: matrix.name != 'worker-smoke'
        timeout-minutes: 6
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          for attempt in 1 2 3; do
            if npx playwright install-deps chromium; then exit 0; fi
            echo "install-deps が失敗(試行 $attempt/3)"
          done
          exit 1
      - run: npx playwright install chromium
        if: matrix.name != 'worker-smoke' && steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npm run e2e -- ${{ matrix.args }}
      - name: E2E の失敗時の成果物(スクリーンショット・トレース)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.name }}
          path: node_modules/.cache/e2e-results
          if-no-files-found: ignore

  verify:
    if: always()
    needs: [lint, typecheck, unit, build, check-dist, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: すべてのジョブの結果を確認する
        run: |
          echo "lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }} check-dist=${{ needs.check-dist.result }} unit=${{ needs.unit.result }} build=${{ needs.build.result }} e2e=${{ needs.e2e.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.typecheck.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.check-dist.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
