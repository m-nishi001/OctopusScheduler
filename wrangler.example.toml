# wrangler.toml のテンプレート。`.clasp.example.json` と同じ位置付けで、
# `npm run deploy:cloudflare` が scripts/setup-cloudflare.js で D1/R2 を作成し、
# 各 REPLACE_WITH_* を埋めた `wrangler.toml` を生成する(`wrangler.toml` はgitignore対象)。
# 手動で使う場合は `wrangler.toml` としてコピーし、REPLACE_WITH_* を置き換える。
name = "octopus-scheduler"
main = "dist/cloudflare/worker.js"
compatibility_date = "2024-09-23"
# AsyncLocalStorage(packages/infrastructures/src/cloudflare/request-context.ts)に必要。
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/cloudflare/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "octopus-scheduler-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "packages/infrastructures/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "REPLACE_WITH_YOUR_R2_BUCKET_NAME"

# session-hub: セッション1件につき1つの Durable Object(WebSocket で更新を push し、無料枠のリクエスト数を節約する)。
# 無料プランでは SQLite バックエンドの Durable Object のみ使える。
[[durable_objects.bindings]]
name = "SESSION_ROOM"
class_name = "SessionRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]
